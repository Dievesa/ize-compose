<!-- Ize Compose v1.1.0 celebration confetti -->
<style>
  #ize-celebration-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
  }
</style>

<script>
(function () {
  const REDUCED_MOTION = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (REDUCED_MOTION) return;

  window.addEventListener('load', function () {
    const canvas = document.createElement('canvas');
    canvas.id = 'ize-celebration-canvas';
    document.body.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    const colors = ['#f4c542', '#f28c28', '#e85d75', '#65c3ba', '#536dfe', '#8e5cd7'];
    const particles = [];
    const gravity = 0.13;
    const drag = 0.985;
    let animationId = null;
    let ending = false;

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function burst(x, y, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 7;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: 4 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.28,
          life: 70 + Math.floor(Math.random() * 30)
        });
      }
    }

    function frame() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vx *= drag;
        p.vy = p.vy * drag + gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.spin;
        p.life--;

        ctx.save();
        ctx.globalAlpha = Math.min(1, p.life / 18);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.65);
        ctx.restore();

        if (p.life <= 0 || p.y > window.innerHeight + 30) {
          particles.splice(i, 1);
        }
      }

      if (particles.length > 0 || !ending) {
        animationId = requestAnimationFrame(frame);
      } else {
        cancelAnimationFrame(animationId);
        canvas.remove();
        window.removeEventListener('resize', resize);
      }
    }

    resize();
    window.addEventListener('resize', resize);

    burst(window.innerWidth * 0.18, window.innerHeight * 0.25, 70);
    setTimeout(() => burst(window.innerWidth * 0.82, window.innerHeight * 0.22, 70), 180);
    setTimeout(() => burst(window.innerWidth * 0.50, window.innerHeight * 0.16, 85), 420);
    setTimeout(() => { ending = true; }, 1250);

    frame();
  }, { once: true });
})();
</script>
