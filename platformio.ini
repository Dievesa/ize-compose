[env:inkplate5]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L  ; 플래시 속도를 80MHz로 고정
board_build.flash_mode = qio     ; 데이터 전송 통로를 4개(Quad)로 확장

lib_extra_dirs = lib
lib_deps =
    SdFat
    U8g2_for_Adafruit_GFX
    ESP32 BLE Keyboard
    Adafruit GFX Library
    Adafruit BusIO
build_unflags = -Os
build_flags =
    -DARDUINO_INKPLATE5V2  ; 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DINKPLATE_5V2         ; 
    -DSCREEN_WIDTH=800
    -DSCREEN_HEIGHT=600
    -O2
    -D CORE_DEBUG_LEVEL=0   ; 모든 시리얼 로그 출력 정지
    

monitor_speed = 921600
upload_speed = 921600
